name: CI — WhatsApp AI SaaS Quality Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql+asyncpg://whatsapp_user:whatsapp_pass@localhost:5432/whatsapp_saas_test"
  REDIS_URL: "redis://localhost:6379/9"
  SECRET_KEY: "ci-test-secret-key-do-not-use-in-prod"
  WHATSAPP_VERIFY_TOKEN: "ci-verify-token"
  WHATSAPP_APP_SECRET: "ci-app-secret"
  ENVIRONMENT: "test"
  DEBUG: "false"
  CELERY_BROKER_URL: "redis://localhost:6379/10"
  CELERY_RESULT_BACKEND: "redis://localhost:6379/11"

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Type Check (fast, no services needed)
  # ───────────────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: "🔍 Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install ruff mypy

      - name: Run ruff linter
        run: ruff check app/ tasks/ --output-format=github

      - name: Run ruff formatter check
        run: ruff format app/ tasks/ --check

      - name: Run mypy
        run: mypy app/ tasks/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # non-blocking for now

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Unit Tests (no services needed)
  # ───────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            --tb=short \
            --cov=app --cov=tasks \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            -q

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.xml
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Integration Tests (requires PostgreSQL + Redis)
  # ───────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: whatsapp_saas
          POSTGRES_USER: whatsapp_user
          POSTGRES_PASSWORD: whatsapp_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U whatsapp_user; do
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --tb=short \
            --cov=app --cov=tasks \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            -q

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4: Security Tests
  # ───────────────────────────────────────────────────────────────────────────
  security-tests:
    name: "🔒 Security Tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: whatsapp_saas
          POSTGRES_USER: whatsapp_user
          POSTGRES_PASSWORD: whatsapp_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run security tests
        run: |
          pytest tests/security/ tests/unit/test_security.py \
            -m "security or unit" \
            --tb=short \
            -q

  # ───────────────────────────────────────────────────────────────────────────
  # Job 5: Coverage Gate (requires all other jobs)
  # ───────────────────────────────────────────────────────────────────────────
  coverage-gate:
    name: "📊 Coverage Gate (≥ 85%)"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: whatsapp_saas
          POSTGRES_USER: whatsapp_user
          POSTGRES_PASSWORD: whatsapp_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run full test suite with coverage enforcement
        run: |
          pytest tests/unit/ tests/integration/ tests/security/ \
            --cov=app --cov=tasks \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 14

      - name: Upload coverage XML (for external tools)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # Job 6: Frontend Tests
  # ───────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: "🎨 Frontend Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test -- --reporter=verbose --passWithNoTests
        continue-on-error: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # Job 7: Docker Build Validation
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t whatsapp-saas:ci .

      - name: Verify image starts
        run: |
          docker run --rm -d \
            --name ci-container \
            -e SECRET_KEY=ci-test-key \
            -e DATABASE_URL=postgresql+asyncpg://x:x@localhost/x \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e WHATSAPP_VERIFY_TOKEN=test \
            -e WHATSAPP_APP_SECRET=test \
            whatsapp-saas:ci \
            python -c "from app.main import app; print('✅ App imports OK')"

  # ───────────────────────────────────────────────────────────────────────────
  # Summary: All jobs must pass
  # ───────────────────────────────────────────────────────────────────────────
  ci-success:
    name: "✅ CI Passed"
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - unit-tests
      - integration-tests
      - security-tests
      - coverage-gate
      - frontend-tests
      - docker-build
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more CI jobs failed!"
            exit 1
          fi
          echo "✅ All CI jobs passed successfully!"
