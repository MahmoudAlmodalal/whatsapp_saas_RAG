[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
cache_dir = /tmp/whatsapp_saas_pytest_cache

# ─── Test Markers ─────────────────────────────────────────────────────────────
markers =
    unit:         Pure unit tests — no I/O, fully isolated (deselect with '-m "not unit"')
    integration:  Tests requiring live PostgreSQL + Redis (docker-compose up)
    e2e:          End-to-end tests using Playwright or full-stack HTTP flows
    slow:         Tests that take > 5 seconds to run
    security:     Security and penetration tests (injection, JWT tampering, etc.)
    performance:  Load and throughput tests (Locust, benchmark)

# ─── Output & Display ─────────────────────────────────────────────────────────
addopts =
    -ra
    --strict-markers
    --tb=short
    -q

# ─── Warning Filters ──────────────────────────────────────────────────────────
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:jose
    ignore::PendingDeprecationWarning
    ignore:.*bcrypt.*:DeprecationWarning
