# pyproject.toml
# ─── Coverage Configuration ────────────────────────────────────────────────────

[tool.coverage.run]
source = ["app", "tasks", "celery_app"]
branch = true
omit = [
    "*/migrations/*",
    "*/alembic/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
    "app/worker.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ─── Ruff Linting ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E402", "F401"]
"alembic/*" = ["E402", "F401"]
